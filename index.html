<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financeiro
Transportadora</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script&gt;
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script&gt;

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f1f5f9;
color:#172033;
}

header{
background:#0f172a;
color:white;
padding:30px 20px;
text-align:center;
}

header h1{
margin:0 0 8px;
font-size:30px;
}

header p{
margin:0;
color:#cbd5e1;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.controles{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:22px;
display:flex;
gap:15px;
flex-wrap:wrap;
align-items:end;
}

.campo{
display:flex;
flex-direction:column;
gap:6px;
}

label{
font-size:13px;
font-weight:bold;
}

input,select,button{
height:42px;
padding:0 12px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:14px;
}

button{
background:#2563eb;
color:white;
border:0;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.status{
width:100%;
color:#475569;
font-size:14px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:22px;
}

.card{
background:white;
border-radius:14px;
padding:22px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
border-top:5px solid #2563eb;
}

.card.sc{
border-top-color:#059669;
}

.card.sp{
border-top-color:#7c3aed;
}

.card h2{
margin:0 0 18px;
}

.item{
margin:12px 0;
}

.item small{
display:block;
color:#64748b;
margin-bottom:3px;
}

.item strong{
font-size:20px;
}

.barra-fundo{
height:12px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.barra{
height:100%;
width:0%;
background:#2563eb;
transition:.4s;
}

.barra.alerta{
background:#f59e0b;
}

.barra.perigo{
background:#dc2626;
}

.percentual{
display:block;
margin-top:7px;
font-weight:bold;
font-size:13px;
}

.graficos{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.grafico{
background:white;
border-radius:14px;
padding:20px;
height:400px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.grafico h2{
margin-top:0;
font-size:18px;
}

.tabela{
background:white;
margin-top:22px;
padding:20px;
border-radius:14px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:13px;
border-bottom:1px solid #e2e8f0;
text-align:left;
}

th{
background:#f8fafc;
}

.vermelho{
color:#dc2626;
font-weight:bold;
}

@media(max-width:800px){
.cards,
.graficos{
grid-template-columns:1fr;
}

.container{
padding:15px;
}
}
</style>
</head>

<body>

<header>
<h1>Dashboard Financeiro</h1>
<p>Controle de gastos — Transportadora de Veículos</p>
<p>PR • SC • SP</p>
</header>

<div class="container">

<div class="controles">

<div class="campo">
<label>Selecione sua planilha Excel</label>
<input type="file" id="excel" accept=".xlsx,.xls">
</div>

<div class="campo">
<label>Mês</label>
<select id="mes">
<option value="todos">Todos os meses</option>
</select>
</div>

<div class="campo">
<label>Sede</label>
<select id="sede">
<option value="todas">Todas as sedes</option>
<option value="PR">PR</option>
<option value="SC">SC</option>
<option value="SP">SP</option>
</select>
</div>

<button onclick="carregarExemplo()">
Ver exemplo
</button>

<div class="status" id="status">
Selecione sua planilha Excel para carregar os dados.
</div>

</div>


<div class="cards">

<div class="card">

<h2>Paraná — PR</h2>

<div class="item">
<small>Limite mensal</small>
<strong id="limitePR">R$ 0,00</strong>
</div>

<div class="item">
<small>Gasto realizado</small>
<strong id="gastoPR">R$ 0,00</strong>
</div>

<div class="item">
<small>Saldo disponível</small>
<strong id="saldoPR">R$ 0,00</strong>
</div>

<div class="barra-fundo">
<div class="barra" id="barraPR"></div>
</div>

<span class="percentual" id="percentualPR">
0% utilizado
</span>

</div>


<div class="card sc">

<h2>Santa Catarina — SC</h2>

<div class="item">
<small>Limite mensal</small>
<strong id="limiteSC">R$ 0,00</strong>
</div>

<div class="item">
<small>Gasto realizado</small>
<strong id="gastoSC">R$ 0,00</strong>
</div>

<div class="item">
<small>Saldo disponível</small>
<strong id="saldoSC">R$ 0,00</strong>
</div>

<div class="barra-fundo">
<div class="barra" id="barraSC"></div>
</div>

<span class="percentual" id="percentualSC">
0% utilizado
</span>

</div>


<div class="card sp">

<h2>São Paulo — SP</h2>

<div class="item">
<small>Limite mensal</small>
<strong id="limiteSP">R$ 0,00</strong>
</div>

<div class="item">
<small>Gasto realizado</small>
<strong id="gastoSP">R$ 0,00</strong>
</div>

<div class="item">
<small>Saldo disponível</small>
<strong id="saldoSP">R$ 0,00</strong>
</div>

<div class="barra-fundo">
<div class="barra" id="barraSP"></div>
</div>

<span class="percentual" id="percentualSP">
0% utilizado
</span>

</div>

</div>


<div class="graficos">

<div class="grafico">

<h2>
Limite × Gasto × Saldo
</h2>

<canvas id="grafico1"></canvas>

</div>


<div class="grafico">

<h2>
Gastos por sede
</h2>

<canvas id="grafico2"></canvas>

</div>

</div>


<div class="tabela">

<h2>Resumo financeiro</h2>

<div id="resultadoTabela">
Carregue uma planilha para visualizar os dados.
</div>

</div>

</div>


<script>

let gastos = [];
let limites = [];

let grafico1 = null;
let grafico2 = null;

const sedes = ["PR","SC","SP"];


function dinheiro(valor){

return Number(valor || 0).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


function numero(valor){

if(typeof valor === "number"){
return valor;
}

if(!valor){
return 0;
}

let texto = String(valor)
.replace("R$","")
.trim();

if(texto.includes(",")){
texto = texto
.replace(/\./g,"")
.replace(",",".");
}

return Number(texto) || 0;

}


function obterMes(data){

if(!data){
return "";
}

if(data instanceof Date){

return String(
data.getMonth()+1
).padStart(2,"0")
+ "/" +
data.getFullYear();

}

let texto = String(data).trim();

let partes = texto.split("/");

if(partes.length === 3){

return partes[1].padStart(2,"0")
+ "/" +
partes[2];

}

partes = texto.split("-");

if(partes.length === 3){

return partes[1].padStart(2,"0")
+ "/" +
partes[0];

}

return texto;

}


document
.getElementById("excel")
.addEventListener(
"change",
function(event){

const arquivo =
event.target.files[0];

if(!arquivo){
return;
}

const leitor =
new FileReader();

leitor.onload =
function(e){

try{

const workbook =
XLSX.read(
e.target.result,
{
type:"array",
cellDates:true
}
);


const abaGastos =
workbook.Sheets["Gastos"];

const abaLimites =
workbook.Sheets["Limites"];


if(!abaGastos){

alert(
'Sua planilha precisa ter uma aba chamada "Gastos".'
);

return;

}


const dadosGastos =
XLSX.utils.sheet_to_json(
abaGastos,
{
defval:""
}
);


gastos =
dadosGastos.map(
linha => {

return {

Data:
linha.Data,

Sede:
String(
linha.Sede
)
.trim()
.toUpperCase(),

Categoria:
linha.Categoria,

Descricao:
linha.Descrição ||
linha.Descricao,

Valor:
numero(
linha.Valor
),

Mes:
linha.Mes ||
obterMes(
linha.Data
)

};

}
);


if(abaLimites){

const dadosLimites =
XLSX.utils.sheet_to_json(
abaLimites,
{
defval:""
}
);


limites =
dadosLimites.map(
linha => {

return {

Mes:
String(
linha.Mes
),

Sede:
String(
linha.Sede
)
.trim()
.toUpperCase(),

Limite:
numero(
linha.Limite
)

};

}
);

}


preencherMeses();

atualizar();

document.getElementById(
"status"
).innerHTML =
"✅ Planilha carregada com sucesso!";


}
catch(erro){

console.error(erro);

document.getElementById(
"status"
).innerHTML =
"❌ Erro ao ler a planilha.";

}

};


leitor.readAsArrayBuffer(
arquivo
);

}
);


function preencherMeses(){

const select =
document.getElementById(
"mes"
);


const meses = [
...new Set(
gastos.map(
x => x.Mes
)
)
];


select.innerHTML =
'<option value="todos">Todos os meses</option>';


meses.forEach(
mes => {

const option =
document.createElement(
"option"
);

option.value = mes;

option.textContent = mes;

select.appendChild(
option
);

}
);

}


function resumo(sede){

const mes =
document.getElementById(
"mes"
).value;


let listaGastos =
gastos.filter(
x =>
x.Sede === sede
);


if(mes !== "todos"){

listaGastos =
listaGastos.filter(
x =>
x.Mes === mes
);

}


const gasto =
listaGastos.reduce(
(total,item) =>
total + item.Valor,
0
);


let listaLimites =
limites.filter(
x =>
x.Sede === sede
);


if(mes !== "todos"){

listaLimites =
listaLimites.filter(
x =>
x.Mes === mes
);

}


const limite =
listaLimites.reduce(
(total,item) =>
total + item.Limite,
0
);


const saldo =
limite
gasto;

const percentual =
limite > 0
? gasto / limite * 100
: 0;


return {
limite,
gasto,
saldo,
percentual
};

}


function atualizarCards(){

sedes.forEach(
sede => {

const r =
resumo(sede);


document.getElementById(
"limite"+sede
).textContent =
dinheiro(r.limite);


document.getElementById(
"gasto"+sede
).textContent =
dinheiro(r.gasto);


document.getElementById(
"saldo"+sede
).textContent =
dinheiro(r.saldo);


const porcentagem =
Math.round(
r.percentual
);


document.getElementById(
"percentual"+sede
).textContent =
porcentagem +
"% utilizado";


const barra =
document.getElementById(
"barra"+sede
);


barra.style.width =
Math.min(
porcentagem,
100
) + "%";


barra.className =
"barra";


if(porcentagem >= 90){

barra.classList.add(
"perigo"
);

}
else if(porcentagem >= 70){

barra.classList.add(
"alerta"
);

}

}
);

}


function atualizarGraficos(){

const filtro =
document.getElementById(
"sede"
).value;


const lista =
filtro === "todas"
? sedes
: [filtro];


const dados =
lista.map(
sede =>
resumo(sede)
);


if(grafico1){
grafico1.destroy();
}


grafico1 =
new Chart(
document.getElementById(
"grafico1"
),
{

type:"bar",

data:{

labels:lista,

datasets:[

{
label:"Limite",
data:
dados.map(
x =>
x.limite
)
},

{
label:"Gasto",
data:
dados.map(
x =>
x.gasto
)
},

{
label:"Saldo disponível",
data:
dados.map(
x =>
Math.max(
x.saldo,
0
)
)
}

]

},

options:{

responsive:true,

maintainAspectRatio:false,

scales:{

y:{

beginAtZero:true,

ticks:{

callback:
valor =>
dinheiro(
valor
)

}

}

}

}

}
);


if(grafico2){
grafico2.destroy();
}


grafico2 =
new Chart(
document.getElementById(
"grafico2"
),
{

type:"doughnut",

data:{

labels:lista,

datasets:[

{

data:
dados.map(
x =>
x.gasto
)

}

]

},

options:{

responsive:true,

maintainAspectRatio:false

}

}
);


let html = `

<table>

<thead>

<tr>

<th>Sede</th>
<th>Limite</th>
<th>Gasto</th>
<th>Saldo disponível</th>
<th>Utilização</th>

</tr>

</thead>

<tbody>

`;


lista.forEach(
(sede,index) => {

const r =
dados[index];


html += `

<tr>

<td>
<strong>
${sede}
</strong>
</td>

<td>
${dinheiro(
r.limite
)}
</td>

<td>
${dinheiro(
r.gasto
)}
</td>

<td>
${dinheiro(
r.saldo
)}
</td>

<td>
${Math.round(
r.percentual
)}%
</td>

</tr>

`;

}
);


html += `
</tbody>
</table>
`;


document.getElementById(
"resultadoTabela"
).innerHTML =
html;

}


function atualizar(){

atualizarCards();

atualizarGraficos();

}


document
.getElementById("mes")
.addEventListener(
"change",
atualizar
);


document
.getElementById("sede")
.addEventListener(
"change",
atualizar
);


function carregarExemplo(){

gastos = [

{
Data:"01/08/2026",
Sede:"PR",
Categoria:"Combustível",
Valor:1500,
Mes:"08/2026"
},

{
Data:"03/08/2026",
Sede:"PR",
Categoria:"Pedágio",
Valor:850,
Mes:"08/2026"
},

{
Data:"05/08/2026",
Sede:"PR",
Categoria:"Manutenção",
Valor:3200,
Mes:"08/2026"
},

{
Data:"02/08/2026",
Sede:"SC",
Categoria:"Combustível",
Valor:2100,
Mes:"08/2026"
},

{
Data:"04/08/2026",
Sede:"SC",
Categoria:"Pedágio",
Valor:850,
Mes:"08/2026"
},

{
Data:"09/08/2026",
Sede:"SC",
Categoria:"Manutenção",
Valor:1800,
Mes:"08/2026"
},

{
Data:"02/08/2026",
Sede:"SP",
Categoria:"Combustível",
Valor:5000,
Mes:"08/2026"
},

{
Data:"06/08/2026",
Sede:"SP",
Categoria:"Manutenção",
Valor:3200,
Mes:"08/2026"
},

{
Data:"10/08/2026",
Sede:"SP",
Categoria:"Pedágio",
Valor:2400,
Mes:"08/2026"
}

];


limites = [

{
Mes:"08/2026",
Sede:"PR",
Limite:50000
},

{
Mes:"08/2026",
Sede:"SC",
Limite:40000
},

{
Mes:"08/2026",
Sede:"SP",
Limite:60000
}

];


preencherMeses();

atualizar();


document.getElementById(
"status"
).innerHTML =
"✅ Exemplo carregado. Agora selecione seu Excel.";

}


carregarExemplo();

</script>

</body>
</html>
