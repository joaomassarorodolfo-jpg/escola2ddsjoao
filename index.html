<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard de Gastos
Transportadora</title>
<!
-Biblioteca para ler Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script&gt;
<!
-Biblioteca para gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script&gt;
<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #1f2937;
}

header {
background: #111827;
color: white;
padding: 25px;
text-align: center;
}

header h1 {
margin: 0 0 8px;
}

header p {
margin: 0;
color: #d1d5db;
}

.container {
max-width: 1200px;
margin: 25px auto;
padding: 0 18px;
}

/* CONTROLES */

.controles {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 2px 10px #00000012;
margin-bottom: 20px;

display: flex;
gap: 15px;
flex-wrap: wrap;
align-items: end;
}

.campo {
display: flex;
flex-direction: column;
gap: 6px;
}

label {
font-weight: bold;
font-size: 14px;
}

input,
select,
button {
padding: 11px 13px;
border: 1px solid #d1d5db;
border-radius: 8px;
font-size: 14px;
}

button {
background: #2563eb;
color: white;
border: none;
cursor: pointer;
font-weight: bold;
}

button:hover {
background: #1d4ed8;
}

.status {
width: 100%;
font-size: 14px;
color: #4b5563;
}

/* CARDS */

.cards {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 18px;
margin-bottom: 20px;
}

.card {
background: white;
border-radius: 14px;
padding: 20px;
box-shadow: 0 2px 10px #00000012;
border-top: 5px solid #2563eb;
}

.card.sc {
border-top-color: #059669;
}

.card.sp {
border-top-color: #7c3aed;
}

.card h2 {
margin: 0 0 15px;
}

.valor {
margin: 9px 0;
font-size: 16px;
}

.valor strong {
font-size: 20px;
}

/* BARRA DE PROGRESSO */

.barra {
height: 12px;
background: #e5e7eb;
border-radius: 20px;
overflow: hidden;
margin: 14px 0 7px;
}

.progresso {
height: 100%;
width: 0;
background: #2563eb;
transition: width .4s;
}

.progresso.alerta {
background: #f59e0b;
}

.progresso.perigo {
background: #dc2626;
}

/* GRÁFICOS */

.graficos {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}

.grafico {
background: white;
border-radius: 14px;
padding: 20px;
box-shadow: 0 2px 10px #00000012;
min-height: 350px;
}

.grafico h2 {
margin-top: 0;
}

/* TABELA */

.tabela {
background: white;
border-radius: 14px;
padding: 20px;
margin-top: 20px;
box-shadow: 0 2px 10px #00000012;
overflow-x: auto;
}

table {
width: 100%;
border-collapse: collapse;
}

th,
td {
padding: 12px;
border-bottom: 1px solid #e5e7eb;
text-align: left;
}

th {
background: #f9fafb;
}

.vazio {
padding: 30px;
text-align: center;
color: #6b7280;
}

/* CELULAR */

@media (max-width: 800px) {

.cards,
.graficos {
grid-template-columns: 1fr;
}

}
</style>
</head>

<body>

<header>

<h1>Dashboard de Gastos</h1>

<p>
Transportadora de veículos — PR • SC • SP
</p>

</header>


<div class="container">

<!
-CONTROLES -->
<div class="controles">

<div class="campo">

<label for="arquivo">
Planilha Excel
</label>

<input
type="file"
id="arquivo"
accept=".xlsx,.xls"
>

</div>


<div class="campo">

<label for="mes">
Mês
</label>

<select id="mes">

<option value="todos">
Todos os meses
</option>

</select>

</div>


<div class="campo">

<label for="sede">
Sede
</label>

<select id="sede">

<option value="todas">
Todas
</option>

<option value="PR">
PR
</option>

<option value="SC">
SC
</option>

<option value="SP">
SP
</option>

</select>

</div>


<button id="btnExemplo">
Carregar exemplo
</button>


<div
class="status"
id="status"
>
Selecione uma planilha Excel ou carregue o exemplo.
</div>

</div>


<!
-CARDS -->
<div class="cards">


<!
-PR -->
<div class="card">

<h2>PR</h2>

<div class="valor">
Limite:
<strong id="limitePR">
R$ 0,00
</strong>
</div>

<div class="valor">
Gasto:
<strong id="gastoPR">
R$ 0,00
</strong>
</div>

<div class="valor">
Disponível:
<strong id="saldoPR">
R$ 0,00
</strong>
</div>

<div class="barra">

<div
class="progresso"
id="barraPR"
></div>

</div>

<small id="percentPR">
0% utilizado
</small>

</div>


<!
-SC -->
<div class="card sc">

<h2>SC</h2>

<div class="valor">
Limite:
<strong id="limiteSC">
R$ 0,00
</strong>
</div>

<div class="valor">
Gasto:
<strong id="gastoSC">
R$ 0,00
</strong>
</div>

<div class="valor">
Disponível:
<strong id="saldoSC">
R$ 0,00
</strong>
</div>

<div class="barra">

<div
class="progresso"
id="barraSC"
></div>

</div>

<small id="percentSC">
0% utilizado
</small>

</div>


<!
-SP -->
<div class="card sp">

<h2>SP</h2>

<div class="valor">
Limite:
<strong id="limiteSP">
R$ 0,00
</strong>
</div>

<div class="valor">
Gasto:
<strong id="gastoSP">
R$ 0,00
</strong>
</div>

<div class="valor">
Disponível:
<strong id="saldoSP">
R$ 0,00
</strong>
</div>

<div class="barra">

<div
class="progresso"
id="barraSP"
></div>

</div>

<small id="percentSP">
0% utilizado
</small>

</div>

</div>


<!
-GRÁFICOS -->
<div class="graficos">


<div class="grafico">

<h2>
Limite × Gasto × Saldo
</h2>

<canvas id="graficoGeral"></canvas>

</div>


<div class="grafico">

<h2>
Gastos por sede
</h2>

<canvas id="graficoSedes"></canvas>

</div>

</div>


<!
-TABELA -->
<div class="tabela">

<h2>
Resumo
</h2>

<div
id="tabelaResumo"
class="vazio"
>
Nenhum dado carregado.
</div>

</div>

</div>


<script>

/* ============================
VARIÁVEIS
============================ */

let dadosGastos = [];

let dadosLimites = [];

let graficoGeral = null;

let graficoSedes = null;

const sedes = ["PR", "SC", "SP"];


/* ============================
DADOS DE EXEMPLO
============================ */

const exemploGastos = [

{
Data: "01/08/2026",
Sede: "PR",
Categoria: "Combustível",
Descrição: "Abastecimento",
Valor: 1500
},

{
Data: "03/08/2026",
Sede: "PR",
Categoria: "Pedágio",
Descrição: "Pedágios",
Valor: 850
},

{
Data: "05/08/2026",
Sede: "PR",
Categoria: "Manutenção",
Descrição: "Oficina",
Valor: 3200
},

{
Data: "04/08/2026",
Sede: "SC",
Categoria: "Pedágio",
Descrição: "Pedágios",
Valor: 850
},

{
Data: "07/08/2026",
Sede: "SC",
Categoria: "Combustível",
Descrição: "Abastecimento",
Valor: 2100
},

{
Data: "09/08/2026",
Sede: "SC",
Categoria: "Manutenção",
Descrição: "Oficina",
Valor: 1800
},

{
Data: "02/08/2026",
Sede: "SP",
Categoria: "Combustível",
Descrição: "Abastecimento",
Valor: 5000
},

{
Data: "06/08/2026",
Sede: "SP",
Categoria: "Manutenção",
Descrição: "Oficina",
Valor: 3200
},

{
Data: "10/08/2026",
Sede: "SP",
Categoria: "Pedágio",
Descrição: "Pedágios",
Valor: 2400
}

];


const exemploLimites = [

{
Mes: "08/2026",
Sede: "PR",
Limite: 50000
},

{
Mes: "08/2026",
Sede: "SC",
Limite: 40000
},

{
Mes: "08/2026",
Sede: "SP",
Limite: 60000
}

];


/* ============================
FORMATAÇÃO DE DINHEIRO
============================ */

function moeda(valor) {

return valor.toLocaleString(
"pt-BR",
{
style: "currency",
currency: "BRL"
}
);

}


/* ============================
CONVERTER NÚMERO
============================ */

function numero(valor) {

if (typeof valor === "number") {

return valor;

}

if (!valor) {

return 0;

}

let texto = String(valor)
.trim()
.replace(/R\$\s?/g, "")
.replace(/\./g, "")
.replace(",", ".");

return Number(texto) || 0;

}


/* ============================
NORMALIZAR SEDE
============================ */

function normalizarSede(valor) {

return String(valor || "")
.trim()
.toUpperCase();

}


/* ============================
IDENTIFICAR MÊS
============================ */

function obterMes(data) {

if (!data) {

return "";

}

if (
data instanceof Date &&
!isNaN(data)
) {

return String(
data.getMonth() + 1
).padStart(2, "0")
+ "/" +
data.getFullYear();

}


const texto = String(data)
.trim();


/* DD/MM/YYYY */

let partes = texto.split("/");

if (partes.length === 3) {

return partes[1].padStart(2, "0")
+ "/" +
partes[2];

}


/* YYYY-MM-DD */

partes = texto.split("-");

if (partes.length === 3) {

return partes[1].padStart(2, "0")
+ "/" +
partes[0];

}


return texto;

}


/* ============================
CARREGAR EXEMPLO
============================ */

function carregarExemplo() {

dadosGastos = exemploGastos;

dadosLimites = exemploLimites;

preencherMeses();

document.getElementById(
"status"
).textContent =
"Exemplo carregado. Agora você pode colocar sua planilha Excel.";

atualizar();

}


document
.getElementById("btnExemplo")
.addEventListener(
"click",
carregarExemplo
);


/* ============================
CARREGAR EXCEL
============================ */

document
.getElementById("arquivo")
.addEventListener(
"change",
function(event) {

const arquivo =
event.target.files[0];

if (!arquivo) return;


const leitor =
new FileReader();


leitor.onload =
function(e) {

try {

const workbook =
XLSX.read(
e.target.result,
{
type: "array"
}
);


/*
Aba GASTOS
*/

const abaGastos =
workbook.Sheets["Gastos"]
||
workbook.Sheets[
workbook.SheetNames[0]
];


dadosGastos =
XLSX.utils.sheet_to_json(
abaGastos
);


/*
Aba LIMITES
*/

const abaLimites =
workbook.Sheets["Limites"];


if (abaLimites) {

dadosLimites =
XLSX.utils.sheet_to_json(
abaLimites
);

} else {

dadosLimites = [];

}


/*
NORMALIZAR DADOS
*/

dadosGastos =
dadosGastos.map(
linha => ({

...linha,

Sede:
normalizarSede(
linha.Sede
),

Valor:
numero(
linha.Valor
),

Mes:
linha.Mes ||
obterMes(
linha.Data
)

})
);


dadosLimites =
dadosLimites.map(
linha => ({

...linha,

Sede:
normalizarSede(
linha.Sede
),

Limite:
numero(
linha.Limite
),

Mes:
linha.Mes || ""

})
);


preencherMeses();


document.getElementById(
"status"
).textContent =
`Planilha "${arquivo.name}" carregada com sucesso.`;


atualizar();

}

catch (erro) {

console.error(erro);

document.getElementById(
"status"
).textContent =
"Erro ao ler a planilha. Confira os nomes das colunas.";

}

};


leitor.readAsArrayBuffer(
arquivo
);

}
);


/* ============================
FILTROS
============================ */

document
.getElementById("mes")
.addEventListener(
"change",
atualizar
);


document
.getElementById("sede")
.addEventListener(
"change",
atualizar
);


/* ============================
PREENCHER MESES
============================ */

function preencherMeses() {

const select =
document.getElementById("mes");


const valorAtual =
select.value;


const meses =
[
...new Set(

[

...dadosGastos.map(
x =>
x.Mes ||
obterMes(x.Data)
),

...dadosLimites.map(
x => x.Mes
)

]

.filter(Boolean)

)

].sort();


select.innerHTML =
`
<option value="todos">
Todos os meses
</option>
`;


meses.forEach(
mes => {

const option =
document.createElement(
"option"
);

option.value = mes;

option.textContent = mes;

select.appendChild(
option
);

}
);


if (
meses.includes(valorAtual)
) {

select.value =
valorAtual;

}

}


/* ============================
CALCULAR RESUMO
============================ */

function obterResumo(sede) {

const mesSelecionado =
document.getElementById(
"mes"
).value;


let gastos =
dadosGastos.filter(
x =>
x.Sede === sede
);


if (
mesSelecionado !== "todos"
) {

gastos =
gastos.filter(
x =>
(
x.Mes ||
obterMes(x.Data)
) ===
mesSelecionado
);

}


const gasto =
gastos.reduce(
(total, x) =>
total +
numero(x.Valor),
0
);


let limites =
dadosLimites.filter(
x =>
x.Sede === sede
);


if (
mesSelecionado !== "todos"
) {

limites =
limites.filter(
x =>
String(x.Mes) ===
mesSelecionado
);

}


const limite =
limites.reduce(
(total, x) =>
total +
numero(x.Limite),
0
);


const saldo =
limite
gasto;

const percentual =
limite > 0
? (gasto / limite) * 100
: 0;


return {

gasto,
limite,
saldo,
percentual

};

}


/* ============================
ATUALIZAR DASHBOARD
============================ */

function atualizar() {

const sedeSelecionada =
document.getElementById(
"sede"
).value;


sedes.forEach(
sede => {

const resumo =
obterResumo(sede);


document.getElementById(
"limite" + sede
).textContent =
moeda(
resumo.limite
);


document.getElementById(
"gasto" + sede
).textContent =
moeda(
resumo.gasto
);


document.getElementById(
"saldo" + sede
).textContent =
moeda(
resumo.saldo
);


const percentual =
Math.round(
resumo.percentual
);


document.getElementById(
"percent" + sede
).textContent =
percentual +
"% utilizado";


const barra =
document.getElementById(
"barra" + sede
);


barra.style.width =
Math.min(
percentual,
100
) + "%";


barra.classList.remove(
"alerta",
"perigo"
);


if (
percentual >= 90
) {

barra.classList.add(
"perigo"
);

}

else if (
percentual >= 70
) {

barra.classList.add(
"alerta"
);

}

}
);


const sedesGrafico =
sedeSelecionada === "todas"
? sedes
: [sedeSelecionada];


const resumo =
sedesGrafico.map(
obterResumo
);


atualizarGraficos(
sedesGrafico,
resumo
);


atualizarTabela(
sedesGrafico,
resumo
);

}


/* ============================
GRÁFICOS
============================ */

function atualizarGraficos(
sedesGrafico,
resumo
) {

const labels =
sedesGrafico;


/*
GRÁFICO PRINCIPAL
*/

if (graficoGeral) {

graficoGeral.destroy();

}


graficoGeral =
new Chart(

document.getElementById(
"graficoGeral"
),

{

type: "bar",

data: {

labels,

datasets: [

{

label: "Limite",

data:
resumo.map(
x =>
x.limite
)

},

{

label: "Gasto",

data:
resumo.map(
x =>
x.gasto
)

},

{

label:
"Saldo disponível",

data:
resumo.map(
x =>
Math.max(
x.saldo,
0
)
)

}

]

},


options: {

responsive: true,

maintainAspectRatio:
false,


plugins: {

tooltip: {

callbacks: {

label:
context =>

context.dataset.label
+
": "
+
moeda(
context.raw
)

}

}

},


scales: {

y: {

beginAtZero: true,

ticks: {

callback:
valor =>
moeda(valor)

}

}

}

}

}

);


/*
GRÁFICO DE GASTOS
*/

if (graficoSedes) {

graficoSedes.destroy();

}


graficoSedes =
new Chart(

document.getElementById(
"graficoSedes"
),

{

type: "doughnut",

data: {

labels,

datasets: [

{

label:
"Gastos",

data:
resumo.map(
x =>
x.gasto
)

}

]

},


options: {

responsive: true,

maintainAspectRatio:
false,

plugins: {

tooltip: {

callbacks: {

label:
context =>

context.label
+
": "
+
moeda(
context.raw
)

}

}

}

}

}

);

}


/* ============================
TABELA
============================ */

function atualizarTabela(
sedesGrafico,
resumo
) {

let html = `

<table>

<thead>

<tr>

<th>Sede</th>

<th>Limite</th>

<th>Gasto</th>

<th>Saldo disponível</th>

<th>Utilização</th>

</tr>

</thead>

<tbody>

`;


sedesGrafico.forEach(
(sede, i) => {

const x =
resumo[i];


html += `

<tr>

<td>
<strong>
${sede}
</strong>
</td>

<td>
${moeda(x.limite)}
</td>

<td>
${moeda(x.gasto)}
</td>

<td>
${moeda(x.saldo)}
</td>

<td>
${Math.round(
x.percentual
)}%
</td>

</tr>

`;

}
);


html += `

</tbody>

</table>

`;


document.getElementById(
"tabelaResumo"
).innerHTML = html;

}


/* ============================
INICIAR
============================ */

carregarExemplo();

</script>

</body>
</html>
<p></p>
