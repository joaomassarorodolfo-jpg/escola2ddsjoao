<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos - Transportadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        h2 {
            margin: 0 0 10px;
            color: #333;
            font-size: 22px;
        }
        .mes {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .total-box {
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .total-box span {
            display: block;
            font-size: 12px;
            color: #555;
        }
        .total-box strong {
            font-size: 28px;
            color: #d9534f;
        }
        .details {
            text-align: left;
            font-size: 14px;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .details ul {
            padding-left: 20px;
            margin: 5px 0 0;
        }
        .details li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="gestao-de-frotas.webp" alt="Caminhão de Transporte">
        <div class="card-content">
            <h2>Gestão de Frota</h2>
            <div class="mes">Mês: Julho / 2026</div>
            
            <div class="total-box">
                <span>Total Gasto no Mês</span>
                <strong>R$ 45.890,00</strong>
            </div>

            <div class="details">
                <strong>Principais Custos:</strong>
                <ul>
                    <li>Combustível (Diesel): R$ 25.000,00</li>
                    <li>Manutenção e Peças: R$ 12.000,00</li>
                    <li>Pedágios: R$ 8.890,00</li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
